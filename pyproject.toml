[project]
name = "captre"
version = "0.1.0"
description = "On-chain attestation service — first-claim proofs anchored on Algorand via x402"
readme = "README.md"
authors = [
    { name = "wiseman-umanah", email = "wisemanumanah@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "algorand-python>=3.5.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "py-algorand-sdk>=2.11.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
    "x402-avm[avm,extensions,fastapi]>=2.0.2",
]

# ---------------------------------------------------------------------------
# Entry-point scripts  (uv run <name>  or  just  <name>  after install)
# ---------------------------------------------------------------------------
# uv run captre     — start the API server (hot-reload, port 8000)
# uv run captre-test — run the full unit test suite
# uv run captre-lint — ruff lint check
# uv run captre-fmt  — ruff auto-format
# uv run captre-deploy — deploy / re-use the Algorand smart contract
# ---------------------------------------------------------------------------
[project.scripts]
captre        = "captre:main"
captre-test   = "captre._scripts:test"
captre-lint   = "captre._scripts:lint"
captre-fmt    = "captre._scripts:fmt"
captre-deploy = "captre._scripts:deploy"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "algokit-utils>=4.2.3",
    "algorand-python>=3.5.1",
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths   = ["tests"]
